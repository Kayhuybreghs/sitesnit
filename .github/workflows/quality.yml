name: Sitesnit quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONTACT_EMAIL_ENABLED: 'false'
      HUB_ENABLED: 'false'
      SITESNIT_LOCAL_SQLITE: 'true'
      RATE_LIMIT_SECRET: 'ci-fixture-only-not-a-production-secret'
      VERCEL_ENV: 'production' # Indexability is tested with the exact production Host header.
      SEO_TEST_ORIGIN: 'http://127.0.0.1:5186'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev --include=optional --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:all
      - run: npm run build:vercel
      - name: Public routes, schema, redirects and security
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 5186 > /tmp/sitesnit-next.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5186/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:routes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-validation
          path: reports/routes-na-herstel.json
